<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1524 10" width="1524" height="10" role="img" aria-label="footer-bar">
<image href="data:image/png;base64," x="0" y="0" width="1524" height="10" preserveAspectRatio="xMidYMid meet"/>
<!-- animated glow dots — sama kayak sebelumnya -->
<circle cx="1402" cy="14" r="4.5" fill="#00e5ff" opacity="0.95"><animate attributeName="opacity" values="0.95;0.25;0.95" dur="1.4s" repeatCount="indefinite"/></circle>
<circle cx="1463" cy="14" r="3.2" fill="#a855f7" opacity="0.85"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.7s" repeatCount="indefinite"/></circle>
<circle cx="1341" cy="14" r="2.5" fill="#f59e0b" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2s" repeatCount="indefinite"/></circle>
<!-- glowing border -->
<rect x="0.5" y="0.5" width="1523" height="9" rx="8" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.18;0.05;0.18" dur="2.5s" repeatCount="indefinite"/></rect>
</svg>
