<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
<title id="title">Andhika Pratama Putra - Developer RPG Hero</title>
<desc id="desc">Cyberpunk RPG hero banner with Andhika Pratama Putra Fullstack Developer, Cloud Enthusiast, Network Engineer, University Arc</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050a18"/>
    <stop offset="50%" stop-color="#0a162c"/>
    <stop offset="100%" stop-color="#0f0b1e"/>
  </linearGradient>
  <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0b2e" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0a162c" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00e5ff"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#fbbf24"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-opacity="0.15" stroke-width="1"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="neonGlow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2"/>
<rect width="1200" height="560" rx="16" fill="url(#grid)" opacity="0.6"/>
<rect width="1200" height="560" rx="16" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>

<!-- Top HUD bar -->
<rect x="12" y="12" width="145" height="52" rx="8" fill="#0a162c" stroke="#1e3a5f" stroke-width="1.2"/>
<text x="22" y="26" font-family="JetBrains Mono,Consolas,monospace" font-size="7.5" fill="#00ff88" letter-spacing="0.8">▶ SYSTEM ONLINE</text>
<text x="22" y="38" font-family="JetBrains Mono,Consolas,monospace" font-size="7.5" fill="#00e5ff" letter-spacing="0.8">▶ PROFILE LOADED</text>
<text x="22" y="50" font-family="JetBrains Mono,Consolas,monospace" font-size="7.5" fill="#fbbf24" letter-spacing="0.8">▶ READY TO CODE</text>
<circle cx="130" cy="18" r="3" fill="#00ff88" opacity="0.9">
  <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
</circle>

<!-- City window background (right center) -->
<rect x="520" y="20" width="420" height="220" rx="10" fill="#0a0e24" stroke="#2a3a5f" stroke-width="1.5"/>
<!-- windows with city lights -->
<g opacity="0.9">
  <rect x="535" y="32" width="190" height="85" rx="4" fill="#0f172a" stroke="#3a4a6a" stroke-width="1"/>
  <rect x="735" y="32" width="190" height="85" rx="4" fill="#0f172a" stroke="#3a4a6a" stroke-width="1"/>
  <!-- city skyline silhouettes -->
  <g fill="#1e2d4a" opacity="0.8">
    <rect x="540" y="75" width="18" height="35" rx="1"/><rect x="562" y="65" width="22" height="45" rx="1"/><rect x="588" y="80" width="15" height="30" rx="1"/><rect x="610" y="70" width="20" height="40" rx="1"/><rect x="635" y="78" width="16" height="32" rx="1"/><rect x="658" y="62" width="24" height="48" rx="1"/><rect x="688" y="72" width="18" height="38" rx="1"/>
    <rect x="740" y="75" width="18" height="35" rx="1"/><rect x="762" y="65" width="22" height="45" rx="1"/><rect x="788" y="80" width="15" height="30" rx="1"/><rect x="810" y="70" width="20" height="40" rx="1"/><rect x="835" y="78" width="16" height="32" rx="1"/><rect x="858" y="62" width="24" height="48" rx="1"/><rect x="888" y="72" width="18" height="38" rx="1"/>
  </g>
  <!-- windows lights -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="545" y="85" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="565" y="75" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="595" y="90" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="745" y="85" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="815" y="78" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.3s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#00e5ff" opacity="0.6">
    <rect x="585" y="98" width="6" height="2" rx="1"/><rect x="625" y="98" width="6" height="2" rx="1"/><rect x="785" y="98" width="6" height="2" rx="1"/>
  </g>
</g>
<!-- Stars -->
<g fill="#fff" opacity="0.5">
  <circle cx="560" cy="42" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="48" r="0.8"/><circle cx="800" cy="40" r="1"/><circle cx="880" cy="50" r="0.8"/>
</g>

<!-- Desk scene (inside window bottom) -->
<rect x="520" y="125" width="420" height="115" rx="0" fill="#0b1220" opacity="0.9"/>
<!-- Desk -->
<rect x="540" y="185" width="380" height="8" rx="2" fill="#2a1f14"/>
<rect x="560" y="193" width="12" height="22" fill="#1a120e"/><rect x="880" y="193" width="12" height="22" fill="#1a120e"/>
<!-- Laptop -->
<g>
  <rect x="665" y="152" width="90" height="58" rx="4" fill="#1a2332" stroke="#3a4a6a" stroke-width="1.5"/>
  <rect x="670" y="157" width="80" height="45" rx="2" fill="#050a18"/>
  <text x="695" y="182" font-family="JetBrains Mono,monospace" font-size="14" fill="#00e5ff" font-weight="bold">&lt;/&gt;</text>
  <rect x="650" y="210" width="120" height="6" rx="1" fill="#2a3a5a"/>
  <!-- typing cursor -->
  <rect x="710" y="178" width="8" height="2" rx="1" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</g>
<!-- Character sitting (chibi) -->
<g>
  <!-- chair -->
  <rect x="730" y="165" width="55" height="50" rx="6" fill="#1e293b" opacity="0.9"/>
  <!-- head -->
  <rect x="770" y="110" width="42" height="38" rx="10" fill="#f0c9a8" stroke="#0f172a" stroke-width="1"/>
  <!-- hair (black spiky) -->
  <path d="M 768 125 Q 772 95 790 92 Q 800 88 815 98 Q 818 115 812 128 L 770 128 Z" fill="#0f0f0f"/>
  <path d="M 772 105 L 778 92 L 785 100 L 792 88 L 800 98 L 808 90 L 814 105 Z" fill="#0f0f0f"/>
  <!-- eyes -->
  <ellipse cx="782" cy="128" rx="3.5" ry="4" fill="#0f0f0f"/><ellipse cx="800" cy="128" rx="3.5" ry="4" fill="#0f0f0f"/>
  <circle cx="783.5" cy="126" r="1" fill="#fff" opacity="0.9"/><circle cx="801.5" cy="126" r="1" fill="#fff" opacity="0.9"/>
  <!-- hoodie -->
  <path d="M 755 148 Q 775 142 785 145 Q 805 142 815 155 L 810 185 L 755 185 Z" fill="#1e3a5f"/>
  <rect x="760" y="150" width="45" height="35" rx="8" fill="#1e3a5f"/>
  <rect x="750" y="155" width="18" height="30" rx="6" fill="#1e3a5f"/><rect x="800" y="155" width="18" height="25" rx="6" fill="#1e3a5f"/>
  <!-- hands on laptop -->
  <ellipse cx="720" cy="175" rx="10" ry="6" fill="#f0c9a8"/><ellipse cx="740" cy="175" rx="10" ry="6" fill="#f0c9a8"/>
</g>
<!-- Mug -->
<g>
  <rect x="842" y="170" width="22" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 864 176 q 6 0 6 6 q 0 6 -6 6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="846" y="185" font-size="7" fill="#0f172a">☕</text>
  <!-- steam -->
  <path d="M 848 165 q 2 -4 0 -8" stroke="#fff" stroke-width="1" opacity="0.5" fill="none"><animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/></path>
  <path d="M 853 165 q 2 -4 0 -8" stroke="#fff" stroke-width="1" opacity="0.4" fill="none"><animate attributeName="opacity" values="0.4;0;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/></path>
</g>
<!-- Plant -->
<g>
  <rect x="600" y="168" width="28" height="18" rx="2" fill="#8b5a2b"/>
  <rect x="598" y="166" width="32" height="4" rx="1" fill="#a67c52"/>
  <ellipse cx="614" cy="152" rx="18" ry="12" fill="#0f6b2e"/><ellipse cx="606" cy="145" rx="12" ry="10" fill="#16a34a"/><ellipse cx="622" cy="142" rx="10" ry="8" fill="#22c55e"/>
</g>

<!-- LEFT CENTER - Title -->
<g>
  <text x="28" y="135" font-family="JetBrains Mono,Consolas,monospace" font-size="52" font-weight="900" fill="#fff" letter-spacing="2" style="filter: drop-shadow(0 0 8px rgba(0,229,255,0.5))">ANDH1KA</text>
  <text x="28" y="178" font-family="JetBrains Mono,Consolas,monospace" font-size="32" font-weight="800" fill="#00e5ff" letter-spacing="6">PRATAMA PUTRA</text>
  <rect x="28" y="190" width="340" height="2" rx="1" fill="url(#cyanGrad)" opacity="0.9"/>
  <!-- Role line -->
  <text x="28" y="218" font-family="JetBrains Mono,monospace" font-size="11" fill="#fff" letter-spacing="1.5">✦ FULLSTACK DEVELOPER</text>
  <text x="28" y="238" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#00e5ff" letter-spacing="0.8">◆ CLOUD ENTHUSIAST</text>
  <text x="170" y="238" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#a855f7" letter-spacing="0.8">◆ NETWORK ENGINEER</text>
  <!-- Tags -->
  <g font-family="JetBrains Mono,monospace" font-size="8" fill="#94a3b8">
    <rect x="28" y="255" width="62" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="36" y="267" fill="#00e5ff">&lt;/&gt; CODE</text>
    <rect x="98" y="255" width="62" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="106" y="267" fill="#38bdf8">☁ CLOUD</text>
    <rect x="168" y="255" width="74" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="176" y="267" fill="#22c55e">🌐 NETWORK</text>
    <rect x="250" y="255" width="52" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="258" y="267" fill="#a855f7">🤖 AI</text>
    <rect x="310" y="255" width="74" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="318" y="267" fill="#f59e0b">🛡 SECURITY</text>
    <rect x="392" y="255" width="68" height="18" rx="9" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/><text x="400" y="267" fill="#06b6d4">🐳 DEVOPS</text>
  </g>
</g>

<!-- PLAYER STATUS (right) -->
<g>
  <rect x="970" y="20" width="218" height="220" rx="12" fill="#0a162c" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="970" y="20" width="218" height="28" rx="12" fill="#111f3a"/>
  <rect x="970" y="36" width="218" height="12" fill="#111f3a"/>
  <text x="985" y="38" font-family="JetBrains Mono,monospace" font-size="8" fill="#a855f7" letter-spacing="1">◆ PLAYER STATUS</text>
  <text x="985" y="62" font-family="JetBrains Mono,monospace" font-size="10" fill="#fbbf24" font-weight="bold">LVL 07</text>
  <text x="985" y="78" font-family="JetBrains Mono,monospace" font-size="8" fill="#00e5ff" letter-spacing="0.5">NEW ADVENTURER</text>
  <rect x="985" y="86" width="188" height="1" fill="#1e3a5f" opacity="0.6"/>
  <!-- Stats -->
  <g font-family="JetBrains Mono,monospace" font-size="7">
    <text x="985" y="105" fill="#94a3b8">EXP</text><text x="1110" y="105" fill="#fbbf24">70%</text>
    <rect x="985" y="112" width="188" height="8" rx="4" fill="#1e293b"/><rect x="985" y="112" width="132" height="8" rx="4" fill="url(#goldGrad)"><animate attributeName="width" values="132;136;132" dur="2s" repeatCount="indefinite"/></rect>
    <text x="985" y="138" fill="#94a3b8">HP</text><text x="1095" y="138" fill="#ef4444">100/100</text>
    <rect x="985" y="145" width="188" height="8" rx="4" fill="#1e293b"/><rect x="985" y="145" width="188" height="8" rx="4" fill="#ef4444"/>
    <text x="985" y="171" fill="#94a3b8">ENERGY</text><text x="1098" y="171" fill="#f59e0b">80/100</text>
    <rect x="985" y="178" width="188" height="8" rx="4" fill="#1e293b"/><rect x="985" y="178" width="150" height="8" rx="4" fill="#f59e0b"/>
    <text x="985" y="204" fill="#94a3b8">FOCUS</text><text x="1098" y="204" fill="#38bdf8">90/100</text>
    <rect x="985" y="211" width="188" height="8" rx="4" fill="#1e293b"/><rect x="985" y="211" width="169" height="8" rx="4" fill="#38bdf8"/>
  </g>
</g>

<!-- University Arc badge in center-bottom -->
<g>
  <rect x="480" y="310" width="240" height="34" rx="17" fill="#0a162c" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
  <text x="600" y="332" font-family="JetBrains Mono,monospace" font-size="11" fill="#e9d5ff" font-weight="bold" text-anchor="middle" letter-spacing="1">🎓 UNIVERSITY ARC</text>
  <circle cx="500" cy="327" r="4" fill="#a855f7"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="327" r="4" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
</g>

<!-- Loading bar -->
<g>
  <text x="600" y="370" font-family="JetBrains Mono,monospace" font-size="7" fill="#64748b" text-anchor="middle" letter-spacing="2">▸ NEW ADVENTURE BEGINS ◂</text>
  <rect x="460" y="380" width="280" height="10" rx="5" fill="#0a162c" stroke="#1e3a5f" stroke-width="1"/>
