  <text x="600" y="405" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#475569" text-anchor="middle" letter-spacing="1">SYSTEM INITIALIZING... QUEST IN PROGRESS</text>
</g>

<!-- Journey progress bottom bar -->
<g>
  <rect x="12" y="485" width="1176" height="46" rx="10" fill="#0a162c" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="22" y="502" font-family="JetBrains Mono,monospace" font-size="7" fill="#00e5ff" letter-spacing="1">◆ JOURNEY PROGRESS</text>
  <text x="1100" y="502" font-family="JetBrains Mono,monospace" font-size="7" fill="#94a3b8">65%</text>
  <rect x="22" y="512" width="1060" height="10" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="22" y="512" width="689" height="10" rx="5" fill="url(#cyanGrad)"/>
  <!-- segments -->
  <g stroke="#050a18" stroke-width="1.5" opacity="0.5">
    <line x1="220" y1="512" x2="220" y2="522"/><line x1="380" y1="512" x2="380" y2="522"/><line x1="540" y1="512" x2="540" y2="522"/><line x1="700" y1="512" x2="700" y2="522"/>
  </g>
  <text x="22" y="535" font-family="JetBrains Mono,monospace" font-size="5.5" fill="#475569" letter-spacing="0.5">SMK TKJ  →  TECHNICIAN  →  NOC  →  FULLSTACK  →  CLOUD &amp; AI  →  🎓 UNIVERSITY ARC  →  ???</text>
</g>

<!-- Border glow -->
<rect width="1200" height="560" rx="16" fill="none" stroke="#00e5ff" stroke-opacity="0.08" stroke-width="2"/>
</svg>