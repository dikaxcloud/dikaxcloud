<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Developer Journey">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a162c"/><stop offset="100%" stop-color="#0f0b1e"/></linearGradient></defs>
<rect width="800" height="180" rx="10" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>
<rect x="0" y="0" width="800" height="24" rx="10" fill="#0f1f3a"/><rect x="0" y="14" width="800" height="10" fill="#0f1f3a"/>
<text x="12" y="16" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#ef4444" letter-spacing="0.8">◆ DEVELOPER JOURNEY</text>
