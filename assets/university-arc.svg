<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="University Arc">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a162c"/><stop offset="100%" stop-color="#1a0b2e"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="420" rx="14" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.8"/>
<!-- Header -->
<rect x="0" y="0" width="1200" height="36" rx="14" fill="#1a1030"/>
<rect x="0" y="22" width="1200" height="14" fill="#1a1030"/>
<text x="20" y="23" font-family="JetBrains Mono,monospace" font-size="10" fill="#e9d5ff" letter-spacing="1">🎓 UNIVERSITY ARC — NEW CHAPTER UNLOCKED</text>
<rect x="340" y="8" width="120" height="20" rx="10" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/><text x="400" y="21" font-family="JetBrains Mono,monospace" font-size="7" fill="#22c55e" text-anchor="middle" font-weight="bold">● IN PROGRESS</text>
<!-- Left timeline -->
<g>
  <rect x="20" y="52" width="360" height="348" rx="12" fill="#050a18" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="200" y="74" font-family="JetBrains Mono,monospace" font-size="8" fill="#a855f7" text-anchor="middle" letter-spacing="0.8">◆ DEVELOPER JOURNEY</text>
  <line x1="60" y1="88" x2="60" y2="340" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Timeline items -->
  <g font-family="JetBrains Mono,monospace">
    <!-- SMK -->
    <circle cx="60" cy="100" r="10" fill="#0f1f3a" stroke="#38bdf8" stroke-width="1.5"/><text x="60" y="104" font-size="8" text-anchor="middle">🎓</text>
    <text x="80" y="98" font-size="7.5" fill="#7dd3fc" font-weight="bold">SMK TKJ</text><text x="80" y="110" font-size="6.5" fill="#94a3b8">Informatika Al-Irsyad</text><text x="80" y="120" font-size="6" fill="#64748b">May 2026 — Graduated</text>
    <!-- Technician -->
    <circle cx="60" cy="140" r="10" fill="#0f1f3a" stroke="#f59e0b" stroke-width="1.5"/><text x="60" y="144" font-size="7" text-anchor="middle">🔧</text>
    <text x="80" y="138" font-size="7.5" fill="#fde68a" font-weight="bold">FIELD TECHNICIAN</text><text x="80" y="150" font-size="6.5" fill="#94a3b8">PT. Internet Keluarga</text><text x="80" y="160" font-size="6" fill="#64748b">Jul — Sep 2025</text>
    <!-- NOC -->
    <circle cx="60" cy="180" r="10" fill="#0f1f3a" stroke="#ef4444" stroke-width="1.5"/><text x="60" y="184" font-size="7" text-anchor="middle">🏰</text>
    <text x="80" y="178" font-size="7.5" fill="#fca5a5" font-weight="bold">NOC DEFENDER</text><text x="80" y="190" font-size="6.5" fill="#94a3b8">PT. Internet Keluarga</text><text x="80" y="200" font-size="6" fill="#64748b">Oct — Dec 2025</text>
    <!-- Fullstack -->
    <circle cx="60" cy="220" r="10" fill="#0f1f3a" stroke="#22c55e" stroke-width="1.5"/><text x="60" y="224" font-size="7" text-anchor="middle">⚔</text>
    <text x="80" y="218" font-size="7.5" fill="#86efac" font-weight="bold">FULLSTACK DEV</text><text x="80" y="230" font-size="6.5" fill="#94a3b8">5 Quests Completed</text><text x="80" y="240" font-size="6" fill="#64748b">React • Laravel • Docker</text>
    <!-- Cloud -->
    <circle cx="60" cy="260" r="10" fill="#0f1f3a" stroke="#a855f7" stroke-width="1.5"/><text x="60" y="264" font-size="7" text-anchor="middle">☁</text>
    <text x="80" y="258" font-size="7.5" fill="#d8b4fe" font-weight="bold">CLOUD &amp; AI</text><text x="80" y="270" font-size="6.5" fill="#94a3b8">Homelab • AWS • Gemini</text><text x="80" y="280" font-size="6" fill="#64748b">Exploring</text>
    <!-- University highlighted -->
    <rect x="50" y="292" width="300" height="52" rx="10" fill="#1a1030" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="60" cy="318" r="12" fill="#a855f7"><text x="60" y="322" font-size="9" text-anchor="middle" fill="#fff">🎓</text></circle>
    <text x="80" y="312" font-size="8" fill="#e9d5ff" font-weight="bold">UNIVERSITY ARC</text><text x="80" y="324" font-size="7" fill="#fff">Universitas Mercu Buana</text><text x="80" y="336" font-size="6.5" fill="#22c55e">Aug 2026 — Present • QUEST IN PROGRESS</text>
    <rect x="300" y="306" width="36" height="12" rx="6" fill="#22c55e" opacity="0.2"/><text x="318" y="314" font-size="5" fill="#22c55e" text-anchor="middle">ACTIVE</text>
  </g>
</g>
<!-- Center illustration - Castle university -->
<g>
  <rect x="400" y="52" width="480" height="348" rx="12" fill="url(#sky)" stroke="#2a1f4a" stroke-width="1.2"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="430" cy="70" r="1"/><circle cx="480" cy="75" r="0.8"/><circle cx="520" cy="65" r="1.2"/><circle cx="680" cy="72" r="0.8"/><circle cx="820" cy="68" r="1"/><circle cx="860" cy="80" r="0.8"/>
    <circle cx="450" cy="90" r="0.6"/><circle cx="750" cy="88" r="0.6"/>
  </g>
  <!-- moon -->
  <circle cx="820" cy="80" r="18" fill="#fde68a" opacity="0.9"/><circle cx="828" cy="76" r="14" fill="url(#sky)" opacity="0.8"/>
  <!-- hills -->
  <path d="M 400 320 Q 500 260 600 285 Q 700 310 880 280 L 880 400 L 400 400 Z" fill="#0f1f0e"/>
  <path d="M 400 340 Q 520 290 620 310 Q 740 330 880 300 L 880 400 L 400 400 Z" fill="#14331a"/>
  <!-- castle -->
  <g>
    <!-- main building -->
    <rect x="620" y="160" width="140" height="120" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="625" y="165" width="130" height="8" fill="#3a3a5a"/>
    <!-- towers -->
    <rect x="600" y="140" width="30" height="140" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="595" y="130" width="40" height="18" rx="2" fill="#3a3a5a"/><rect x="605" y="118" width="20" height="16" rx="2" fill="#3a3a5a"/>
    <rect x="750" y="140" width="30" height="140" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="745" y="130" width="40" height="18" rx="2" fill="#3a3a5a"/><rect x="755" y="118" width="20" height="16" rx="2" fill="#3a3a5a"/>
    <!-- flags -->
    <line x1="615" y1="118" x2="615" y2="95" stroke="#4a4a6a" stroke-width="1.5"/><rect x="615" y="95" width="18" height="10" rx="1" fill="#ef4444"/><text x="624" y="103" font-size="5" text-anchor="middle">🚩</text>
    <line x1="765" y1="118" x2="765" y2="95" stroke="#4a4a6a" stroke-width="1.5"/><rect x="765" y="95" width="18" height="10" rx="1" fill="#ef4444"/>
    <!-- windows glowing -->
    <rect x="640" y="190" width="16" height="22" rx="2" fill="#fbbf24" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="670" y="190" width="16" height="22" rx="2" fill="#fbbf24" opacity="0.7"><animate attributeName="opacity" values="0.7;0.9;0.7" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="700" y="190" width="16" height="22" rx="2" fill="#fbbf24" opacity="0.85"><animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="640" y="222" width="16" height="18" rx="2" fill="#67e8f9" opacity="0.6"/><rect x="700" y="222" width="16" height="18" rx="2" fill="#67e8f9" opacity="0.6"/>
    <!-- door -->
    <path d="M 670 250 L 670 280 L 710 280 L 710 250 Q 690 230 670 250" fill="#1a120e" stroke="#3a2a1a" stroke-width="1"/>
    <rect x="690" y="265" width="4" height="4" rx="1" fill="#fbbf24"/>
    <!-- path -->
    <path d="M 690 280 Q 688 310 640 330" stroke="#4a3a1a" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- character walking towards castle (back view) -->
  <g>
    <!-- ground shadow -->
    <ellipse cx="560" cy="355" rx="30" ry="6" fill="#000" opacity="0.3"/>
    <!-- backpack -->
    <rect x="545" y="305" width="22" height="28" rx="5" fill="#8b5a2b" stroke="#5a3a1a" stroke-width="1"/>
    <rect x="548" y="310" width="16" height="10" rx="2" fill="#a67c52"/>
    <!-- body (hoodie) -->
    <rect x="555" y="315" width="36" height="30" rx="8" fill="#1e3a5f" stroke="#0f172a" stroke-width="1"/>
    <!-- head -->
    <ellipse cx="573" cy="302" rx="16" ry="16" fill="#f0c9a8" stroke="#0f172a" stroke-width="1"/>
    <path d="M 558 295 Q 560 275 573 272 Q 586 275 590 295 Z" fill="#0f0f0f"/>
    <!-- legs -->
    <rect x="558" y="344" width="12" height="14" rx="3" fill="#1e293b"/><rect x="576" y="344" width="12" height="14" rx="3" fill="#1e293b"/>
    <ellipse cx="564" cy="360" rx="8" ry="3" fill="#0f0f0f"/><ellipse cx="582" cy="360" rx="8" ry="3" fill="#0f0f0f"/>
    <!-- floating code particles -->
    <g font-family="JetBrains Mono,monospace" font-size="8" fill="#00e5ff" opacity="0.7">
      <text x="520" y="300">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="2s" repeatCount="indefinite"/></text>
      <text x="600" y="290" fill="#a855f7">{ }<animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="2.2s" repeatCount="indefinite"/></text>
      <text x="530" y="285" fill="#fbbf24" font-size="6">01<animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="2.5s" repeatCount="indefinite"/></text>
    </g>
  </g>
  <!-- Clouds -->
  <g fill="#fff" opacity="0.08">
    <ellipse cx="500" cy="110" rx="40" ry="14"/><ellipse cx="540" cy="108" rx="30" ry="12"/><ellipse cx="700" cy="105" rx="35" ry="12"/>
  </g>
  <!-- Quote -->
  <rect x="420" y="360" width="440" height="24" rx="12" fill="#000" opacity="0.5"/>
  <text x="640" y="376" font-family="JetBrains Mono,monospace" font-size="7" fill="#e9d5ff" text-anchor="middle" font-style="italic">“The next chapter has begun.” — August 2026</text>
</g>
<!-- Right panel info -->
<g>
  <rect x="900" y="52" width="280" height="348" rx="12" fill="#050a18" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.2"/>
  <text x="1040" y="74" font-family="JetBrains Mono,monospace" font-size="8" fill="#e9d5ff" text-anchor="middle" font-weight="bold">🎓 UNIVERSITY ARC</text>
  <line x1="920" y1="84" x2="1160" y2="84" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <g font-family="JetBrains Mono,monospace">
    <text x="920" y="104" font-size="7" fill="#64748b">INSTITUTION</text>
    <text x="920" y="120" font-size="9" fill="#fff" font-weight="bold">Universitas Mercu Buana</text>
    <text x="920" y="138" font-size="7" fill="#a855f7">Bachelor of Informatics</text>
    <rect x="920" y="150" width="240" height="22" rx="6" fill="#0f1f3a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="1040" y="165" font-size="7" fill="#94a3b8" text-anchor="middle">AUGUST 2026 — PRESENT</text>
    <text x="920" y="192" font-size="7" fill="#64748b">STATUS</text>
    <rect x="920" y="200" width="240" height="28" rx="8" fill="#0a1a0f" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="1040" y="218" font-size="8" fill="#22c55e" text-anchor="middle" font-weight="bold">● QUEST IN PROGRESS</text>
    <!-- progress bar -->
    <rect x="920" y="240" width="240" height="8" rx="4" fill="#1e293b"/><rect x="920" y="240" width="42" height="8" rx="4" fill="#a855f7"><animate attributeName="width" values="42;52;42" dur="2s" repeatCount="indefinite"/></rect>
    <text x="920" y="260" font-size="6" fill="#475569">▸ New adventure • Learning • Building</text>
    <rect x="920" y="274" width="240" height="1" fill="#1e3a5f" opacity="0.5"/>
    <text x="930" y="292" font-size="6.5" fill="#94a3b8">Current objective:</text>
    <text x="930" y="306" font-size="7" fill="#00e5ff">▶ BUILD • LEARN</text><text x="930" y="320" font-size="7" fill="#a855f7">▶ EXPERIMENT • DEPLOY</text>
    <text x="930" y="338" font-size="6" fill="#475569" font-style="italic">Not yet graduated — new journey</text>
    <text x="930" y="350" font-size="6" fill="#475569" font-style="italic">just started.</text>
    <!-- XP particles -->
    <g fill="#a855f7" opacity="0.5">
      <rect x="1140" y="200" width="6" height="6" rx="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="1130" y="215" width="4" height="4" rx="1"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="1145" y="225" width="5" height="5" rx="1"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.3s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</g>
</svg>